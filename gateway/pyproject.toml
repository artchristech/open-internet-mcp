[project]
name = "open-internet-gateway"
version = "0.1.0"
description = "HTTP + x402 gateway around open-internet-mcp. 26 keyless public APIs as paid endpoints for autonomous agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.scripts]
open-internet-gateway = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
